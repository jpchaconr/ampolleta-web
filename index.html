<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ampolletas</title>
<meta name="description" content="Descarga la app Android para controlar tus ampolletas y tu aire acondicionado.">
<meta name="theme-color" content="#FFF8F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130E" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #FFF8F4; --surface: #F4ECE4; --text: #1F1B16; --muted: #4F4539;
    --primary: #825500; --on-primary: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17130E; --surface: #231F1A; --text: #EBE1D9; --muted: #D3C4B4;
      --primary: #FFB951; --on-primary: #452B00;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  main {
    width: 100%; max-width: 420px; background: var(--surface); border-radius: 28px;
    padding: 40px 28px 32px; text-align: center;
  }
  .icon { width: 96px; height: 96px; margin: 0 auto 20px; border-radius: 28px; background: #1E2126;
    display: grid; place-items: center; }
  h1 { font-size: 28px; font-weight: 500; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 28px; }
  .download {
    display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
    background: var(--primary); color: var(--on-primary); font-weight: 500; font-size: 16px;
    height: 56px; padding: 0 28px; border-radius: 28px;
  }
  .download:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  small { display: block; color: var(--muted); margin-top: 20px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="64" height="64" viewBox="18 18 72 72">
      <path fill="#F0B35A" d="M54,26a20,20 0,0 0,-11.8 36.1c2.4,1.7 3.6,4.2 3.6,6.6v2.7h16.4v-2.7c0,-2.4 1.2,-4.9 3.6,-6.6A20,20 0,0 0,54 26z"/>
      <path fill="#ECEBE6" d="M45.8,74.4h16.4v3.6h-16.4zM47.6,80.8h12.8v3.6h-12.8z"/>
    </svg>
  </div>
  <h1>Ampolletas</h1>
  <p>Controla tus ampolletas por Bluetooth y tu aire acondicionado por Wi-Fi, sin la nube.</p>
  <a class="download" href="https://github.com/jpchaconr/ampolleta-web/releases/download/android-main/ampolletas.apk">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
    Descargar APK
  </a>
  <small>Para Android 8 o superior. Ábrelo desde el teléfono y permite instalar apps de esta fuente.</small>

</html>
